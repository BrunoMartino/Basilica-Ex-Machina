# Generated by the quality-gate skill. Git runs the same gate the agent repairs against.
min_version: 2.0.0
assert_lefthook_installed: true
glob_matcher: doublestar

pre-commit:
  parallel: true
  jobs:
    - name: gitleaks
      run: gitleaks git --pre-commit --staged --redact --no-banner --config .gitleaks.toml
    - name: gofmt
      glob: "**/*.go"
      exclude: ["vendor/**"]
      run: gofmt -w {staged_files}
      stage_fixed: true
    - name: ruff-format
      glob: "**/*.py"
      exclude: [".venv/**", "venv/**"]
      run: ruff format {staged_files}
      stage_fixed: true
    - name: biome-format
      glob: ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.cjs"]
      exclude: ["node_modules/**", "vendor/**"]
      run: biome format --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: php-cs-fixer
      glob: "**/*.php"
      exclude: ["vendor/**"]
      run: php-cs-fixer fix --config=.php-cs-fixer.dist.php --path-mode=intersection --show-progress=none {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: quality-run
      run: scripts/quality/run.sh --stage all
